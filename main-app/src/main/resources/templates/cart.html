<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Корзина товаров</title>
    <meta charset="UTF-8">
    <style>
        .notification {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            background-color: #F08080;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>
<a href="/orders" style="float:right;">
    <b>ЗАКАЗЫ &#x2935;</b>
</a>
<a href="/" style="float:right;">
    <b>ГЛАВНАЯ &#x2935;</b>
</a>
<div class="notification" th:if="${balance.message}" th:text="${balance.message}"></div>
<div class="notification" th:if="${balance.getCurrentValue - total < 0}" th:text="'Недостаточно средств на счете'"></div>

<table style="width:70%;margin-left:auto;margin-right:auto;">
    <tr th:each="item : ${items}">
        <td>
            <table>
                <tr>
                    <td>
                        <img width="300" height="300" th:src="${'http://localhost:8080/images/'+item.getProductId()}"></img>
                    </td>
                </tr>
                <tr>
                    <td>
                        <b th:text="${item.getName()}"></b>
                    </td>
                    <td>
                        <b th:text="${item.getPrice()}+' руб.'"></b>
                    </td>
                </tr>
                <tr><td th:text="${item.getDescription()}"></td></tr>
                <tr>
                    <td>
                        <form th:action="${'/cart/item/'+item.getProductId()}" method="post">
                            <button th:if="${item.getCount() > 0}" name="action" value="minus">-</button>
                            <span th:text="${item.getCount()}"></span>
                            <button name="action" value="plus">+</button>
                            <button name="action" value="delete" style="float:right;">X</button>
                        </form>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    <tr>
        <td style="text-align:right">
            <b th:text="'Итого: '+${total}+' руб.'"></b>
        </td>
    </tr>
    <tr>
        <td style="text-align:right">
            <form action="/buy" method="post" th:if="${!items.isEmpty()}">
                <button th:disabled="${balance.getCurrentValue - total < 0}">Купить</button>
            </form>
        </td>
    </tr>
</table>

<script>
    function showNotification() {
        const notification = document.querySelector('.notification');
        if (notification) {
            notification.style.display = 'block';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        if (document.querySelector('.notification').innerText) {
            showNotification();
        }
    });
</script>

</body>

</html>
